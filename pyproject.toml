[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-pnl-service"
version = "0.1.0"
description = "Trade recorder and PnL service: multi-venue trade ingestion, position tracking, realized/unrealized PnL, idempotent writes, reconciliation and oversell checks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
data = [
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
include = ["tradepnl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
