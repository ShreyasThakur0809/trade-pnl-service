services:
  - type: web
    name: trade-pnl-service
    env: python
    buildCommand: pip install -e .
    startCommand: uvicorn tradepnl.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trade-pnl-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13
      - key: ALLOW_SHORT
        value: false
      - key: RECON_TOLERANCE
        value: 0.00000001

databases:
  - name: trade-pnl-db
    databaseName: tradepnl
    user: tradepnl_user
